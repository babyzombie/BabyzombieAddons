name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  build-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache Loom assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build main
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          ./gradlew build

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  build-sub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 26.2 branch
        uses: actions/checkout@v4
        with:
          ref: 26.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache Loom assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 26.2
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          ./gradlew build

      - name: Upload 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  release:
    needs: [build-main, build-sub]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --sort newest --strip header --output changelog.md
          config: cliff.toml

      - name: Translate Changelog to English / Bilingual
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/translate_changelog.py changelog.md

      - name: Upload English changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-en
          path: changelog-en.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog-bilingual.md
          files: artifacts/**/*
          generate_release_notes: false

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
          GITEE_OWNER: Bluesky-kk
          GITEE_REPO: BabyzombieAddons
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          BODY=$(cat changelog.md)
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          TOKEN="access_token=$GITEE_TOKEN"
          RESP=$(curl -sS "$API/releases/tags/$TAG?$TOKEN")
          RELEASE_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "在 Gitee 上创建 release: $TAG"
            PAYLOAD=$(jq -n --arg tag "$TAG" --arg name "Release $TAG" --arg body "$BODY" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: "main"}')
            RESP=$(curl -sS -w "\n%{http_code}" -X POST "$API/releases?$TOKEN" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY_RESP=$(echo "$RESP" | sed '$d')
            echo "HTTP $HTTP_CODE: $BODY_RESP"
            RELEASE_ID=$(echo "$BODY_RESP" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning ::Gitee 创建 release 失败，跳过同步"
              exit 0
            fi
            echo "创建的 release ID: $RELEASE_ID"
          else
            echo "Gitee 上已存在 release，更新描述"
            PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
            curl -sS -X PATCH "$API/releases/$RELEASE_ID?$TOKEN" \
              -H "Content-Type: application/json" -d "$PAYLOAD" > /dev/null
          fi
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            for f in artifacts/**/*.jar; do
              echo "上传: $f"
              # 海外 runner 访问 Gitee 很慢：120s 超时经常误杀慢速上传导致反复重试
              # （3.4.1 那次跑了 28 分钟）。放宽到 300s，让慢速成功不被判超时。
              for i in 1 2 3; do
                HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --retry 2 \
                  --connect-timeout 30 --max-time 300 \
                  -X POST "$API/releases/$RELEASE_ID/attach_files?$TOKEN" \
                  -F "file=@$f" 2>&1) || HTTP="000"
                if [ "$HTTP" = "200" ]; then echo "上传成功: $f"; break; fi
                echo "::warning ::Gitee 上传第 $i 次失败 (HTTP $HTTP)，5 秒后重试"
                sleep 5
              done
            done
          fi
          echo "Gitee 同步完成"

  # 注意：secrets context 不能出现在任何 if 条件中（job 级/step 级都不行），
  # 只能通过 env 映射后用 steps context 判断。未配置 MODRINTH_TOKEN 时跳过发布。
  publish-modrinth:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Check MODRINTH_TOKEN
        id: check-token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -n "$MODRINTH_TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"; else echo "has_token=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download main jars
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: main-jars
          path: main-jars

      - name: Download 26.2 jars
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sub-jars
          path: sub-jars

      - name: Download English changelog
        if: steps.check-token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: changelog-en

      - name: Extract MC versions from jars
        if: steps.check-token.outputs.has_token == 'true'
        id: mc-versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MC_MAIN=$(ls main-jars/*.jar | sed -E 's/.*-mc([0-9.]+(-rc\.[0-9]+)?)\.jar$/\1/' | head -1)
          MC_SUB=$(ls sub-jars/*.jar | sed -E 's/.*-mc([0-9.]+(-rc\.[0-9]+)?)\.jar$/\1/' | head -1)
          echo "mc_main=${MC_MAIN}" >> "$GITHUB_OUTPUT"
          echo "mc_sub=${MC_SUB}" >> "$GITHUB_OUTPUT"
          echo "version_main=${VERSION}-mc${MC_MAIN}" >> "$GITHUB_ENV"
          echo "version_sub=${VERSION}-mc${MC_SUB}" >> "$GITHUB_ENV"

      - name: Publish main to Modrinth
        if: steps.check-token.outputs.has_token == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: babyzombieaddons
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: main-jars/*.jar
          game-versions: ${{ steps.mc-versions.outputs.mc_main }}
          loaders: fabric
          version: ${{ env.version_main }}
          version-type: release
          changelog-file: changelog-en.md
          dependencies: |
            fabric-api | depends | *
            fabric-language-kotlin | depends | *

      - name: Publish 26.2 to Modrinth
        if: steps.check-token.outputs.has_token == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: babyzombieaddons
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: sub-jars/*.jar
          game-versions: ${{ steps.mc-versions.outputs.mc_sub }}
          loaders: fabric
          version: ${{ env.version_sub }}
          version-type: release
          changelog-file: changelog-en.md
          dependencies: |
            fabric-api | depends | *
            fabric-language-kotlin | depends | *
