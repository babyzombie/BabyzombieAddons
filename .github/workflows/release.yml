name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  build-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache Loom assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build main
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          ./gradlew build

      - name: Upload main artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  build-sub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 26.2 branch
        uses: actions/checkout@v4
        with:
          ref: 26.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache Loom assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraft
          key: loom-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: loom-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build 26.2
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^mod_version=.*/mod_version=${VERSION}/" gradle.properties
          ./gradlew build

      - name: Upload 26.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sub-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  release:
    needs: [build-main, build-sub]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --sort oldest --strip header --output changelog.md
          config: cliff.toml

      - name: Translate Changelog to English / Bilingual
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/translate_changelog.py changelog.md

      - name: Upload bilingual changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-bilingual
          path: changelog-bilingual.md

      - name: Create GitHub Release
        # 用 v3（v2 已 EOL）：tag 已存在 release 时自动走更新而不是失败。
        # name/body 显式传入会被覆盖为最新值，同名资源按 overwrite_files 默认覆盖，重跑安全。
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog-bilingual.md
          files: artifacts/**/*
          generate_release_notes: false

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
          GITEE_OWNER: Bluesky-kk
          GITEE_REPO: BabyzombieAddons
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          BODY=$(cat changelog-bilingual.md)
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"
          TOKEN="access_token=$GITEE_TOKEN"
          RESP=$(curl -sS "$API/releases/tags/$TAG?$TOKEN")
          RELEASE_ID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "在 Gitee 上创建 release: $TAG"
            PAYLOAD=$(jq -n --arg tag "$TAG" --arg name "Release $TAG" --arg body "$BODY" \
              '{tag_name: $tag, name: $name, body: $body, target_commitish: "main"}')
            RESP=$(curl -sS -w "\n%{http_code}" -X POST "$API/releases?$TOKEN" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY_RESP=$(echo "$RESP" | sed '$d')
            echo "HTTP $HTTP_CODE: $BODY_RESP"
            RELEASE_ID=$(echo "$BODY_RESP" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::warning ::Gitee 创建 release 失败，跳过同步"
              exit 0
            fi
            echo "创建的 release ID: $RELEASE_ID"
          else
            echo "Gitee 上已存在 release，更新描述"
            PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
            HTTP=$(curl -sS -o /dev/null -w "%{http_code}" -X PATCH "$API/releases/$RELEASE_ID?$TOKEN" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
            echo "Gitee 描述更新 HTTP $HTTP"
          fi
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            for f in artifacts/**/*.jar; do
              NAME=$(basename "$f")
              # 重跑时 Gitee 不会因同名附件拒绝上传，而是直接再传一份。
              # 先删掉同名旧附件再传，保证 release 里只有一份（Gitee 支持
              # GET 列附件 + DELETE 单附件）。
              echo "清理同名旧附件: $NAME"
              for FILE_ID in $(curl -sS "$API/releases/$RELEASE_ID/attach_files?$TOKEN" \
                | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id' 2>/dev/null || true); do
                HTTP_DEL=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                  "$API/releases/$RELEASE_ID/attach_files/$FILE_ID?$TOKEN")
                echo "  删除旧附件 $FILE_ID: HTTP $HTTP_DEL"
              done
              echo "上传: $f"
              # 海外 runner 访问 Gitee 很慢：120s 超时经常误杀慢速上传导致反复重试
              # （3.4.1 那次跑了 28 分钟）。放宽到 300s，让慢速成功不被判超时。
              for i in 1 2 3; do
                HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --retry 2 \
                  --connect-timeout 30 --max-time 300 \
                  -X POST "$API/releases/$RELEASE_ID/attach_files?$TOKEN" \
                  -F "file=@$f" 2>&1) || HTTP="000"
                if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then echo "上传成功: $f"; break; fi
                echo "::warning ::Gitee 上传第 $i 次失败 (HTTP $HTTP)，5 秒后重试"
                sleep 5
              done
            done
          fi
          echo "Gitee 同步完成"
